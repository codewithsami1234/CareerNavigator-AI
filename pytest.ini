[pytest]
# The suite lives in the resume-intelligence package. This file is what pytest
# loads when you run it from the repository root. The package folder has its
# own pytest.ini for runs started inside that folder.
testpaths = research/01_resume_intelligence/tests
pythonpath = research/01_resume_intelligence
addopts = -q
markers =
    integration: requires a local Tesseract OCR executable
